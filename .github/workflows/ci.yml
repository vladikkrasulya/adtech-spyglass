name: CI

# Runs on pushes to main and on every PR. Mirrors what `npm run ci` does
# locally — Prettier, ESLint, tsc --noEmit, and the node:test suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref when a new commit lands. No need to
# burn minutes finishing a run for a commit that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The baseline suite already takes over14 minutes including release smoke;
    # allow bounded headroom for the additional real-browser/recovery controls.
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 — full history, not the default shallow (depth 1) clone.
      # The privacy-floor guard (scripts/deploy-lib.sh) and its tests resolve a
      # historical commit (PRIVACY_BASELINE_SHA, several commits behind any given
      # tip) via `git rev-parse --verify`/`git merge-base --is-ancestor`, which
      # requires that commit's object to be present. A shallow clone doesn't have
      # it, so ancestry resolution fails closed (empty result) — this is what the
      # guard is DESIGNED to do when it can't verify, but it means the guard (and
      # its tests) cannot function at all without full history. The production
      # host's checkout is a persistent `git clone` + `git pull --ff-only`
      # (full history already), so this only needed fixing here in CI.
      # persist-credentials: false — no later step pushes, so the job token must
      # not stay in .git/config where a compromised dependency script could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # better-sqlite3 ships prebuilds for ubuntu-latest, so this is fast.
      # If a prebuild miss ever forces compilation, ubuntu runners already
      # have python3 + build-essential preinstalled.
      - name: Install dependencies
        run: npm ci

      # Production dependencies only, high and above: a vulnerable runtime
      # package should block a merge; a dev-tool advisory should not (Dependabot
      # and `npm audit fix` handle those).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # ---- preventive security gates -------------------------------------------------------------
      # They live in the `ci` job on purpose: `ci` is the required status check, so they gate every
      # PR (Dependabot included) without a branch-protection change.
      - name: Semgrep rules install and self-test
        env:
          SEMGREP_VERSION: '1.183.0'
        run: |
          python3 -m venv "$RUNNER_TEMP/sg"
          "$RUNNER_TEMP/sg/bin/pip" install -q "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/sg/bin/semgrep" --test --metrics=off --disable-version-check semgrep

      - name: Semgrep project rules (ERROR blocks)
        run: |
          "$RUNNER_TEMP/sg/bin/semgrep" scan --metrics=off --disable-version-check --quiet \
            --config semgrep/ortbtools.yml --severity ERROR --error --exclude node_modules .

      - name: Semgrep new WARNINGs introduced by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/sg/bin/semgrep" scan --metrics=off --disable-version-check --quiet \
            --config semgrep/ortbtools.yml --baseline-commit "$BASE_SHA" --error --exclude node_modules .

      # Full history (fetch-depth: 0 above). The binary is verified against the sha256 published
      # in the upstream release's checksums file before it is executed. --redact keeps any
      # matched value out of the job log.
      - name: gitleaks (full history, default + project rules)
        env:
          GITLEAKS_VERSION: '8.21.2'
          GITLEAKS_SHA256: '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner

      - name: Trivy filesystem (lockfiles, secrets, Dockerfile)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy:/root/.cache" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .git --quiet /src

      # The host runs Compose 5.x, which rejects what older Compose accepts (it refused
      # `pids_limit` next to `deploy.resources`). Keep this equal to `docker compose version` on
      # the host. docker-compose.yml names `.env` in env_file; CI has none, so use the documented example
      # (no secrets) for this parse check only.
      - name: Install the host's Compose version
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1
      - name: docker compose config (tracked file parses on the host's Compose)
        env:
          ORTBTOOLS_TAG: ci
        run: |
          docker compose version
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          rm -f .env

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check (JSDoc + tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: npm pack smoke
        run: bash scripts/npm-pack-smoke.sh

      - name: Docker production smoke
        run: bash scripts/ci-docker-smoke.sh
