name: Publish npm packages

# Publishes @ortbtools/core then @ortbtools/cli to the public npm registry.
# Prerequisites: GitHub secret NPM_TOKEN (Automation token with publish access to
# the @ortbtools scope). See docs/NPM_PUBLISH.md.

on:
  workflow_dispatch:
    inputs:
      publish_core:
        description: Publish @ortbtools/core
        type: boolean
        default: true
      publish_cli:
        description: Publish @ortbtools/cli (requires core on registry)
        type: boolean
        default: false
      dry_run:
        description: npm publish --dry-run only (no upload)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main for live publish
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo 'Live npm publishing is allowed only from refs/heads/main.' >&2
          exit 1

      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root deps (workspace link smoke)
        run: npm ci

      - name: Full CI gate
        run: npm run ci

      - name: npm pack smoke
        run: bash scripts/npm-pack-smoke.sh

      - name: Publish @ortbtools/core
        if: inputs.publish_core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not configured. See docs/NPM_PUBLISH.md"
            exit 1
          fi
          EXTRA=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then EXTRA+=(--dry-run); fi
          npm publish --access public "${EXTRA[@]}"

      - name: Publish @ortbtools/cli
        if: inputs.publish_cli
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not configured. See docs/NPM_PUBLISH.md"
            exit 1
          fi
          EXTRA=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then EXTRA+=(--dry-run); fi
          npm publish --access public "${EXTRA[@]}"
